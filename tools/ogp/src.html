<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- OGP画像（1200×630）の原本。再出力手順は同じフォルダの README.md -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;box-sizing:border-box;background:#17100F;color:#F0E7E7;
    font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;
    background-image:radial-gradient(ellipse 70% 90% at 100% 0%,#1F1617 0%,#17100F 70%);
    border-left:14px solid #D9697A}
  .in{position:absolute;left:84px;right:84px;top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center}
  .eye{margin:0 0 30px;font-size:24px;font-weight:700;letter-spacing:.08em;color:#D9697A;display:flex;align-items:center;gap:16px}
  .eye::before{content:"";width:40px;height:3px;background:#D9697A;display:block}
  h1{margin:0;font-family:"Yu Gothic","YuGothic","Meiryo",sans-serif;font-weight:700;font-size:80px;line-height:1.3;letter-spacing:.02em}
  h1 .hl{color:#D9697A}
  .sub{margin:30px 0 0;font-size:25px;color:#A2918F;letter-spacing:.04em}
  .foot{position:absolute;left:84px;right:84px;bottom:46px;display:flex;align-items:center;justify-content:space-between;
    border-top:1px solid rgba(255,255,255,.12);padding-top:26px}
  .foot img{height:46px;display:block}
  .foot span{font-family:Consolas,monospace;font-size:21px;color:#A2918F;letter-spacing:.03em}
</style></head>
<body>
  <div class="in">
    <p class="eye">未経験からのコンサル転職</p>
    <h1>憧れで、いい。<br><span class="hl">問題は、そこからの道順。</span></h1>
    <p class="sub">狙えるファームの見分け方から、ケース面接対策まで</p>
  </div>
  <div class="foot"><img src="../../logo-white.png" alt="エージェントベスト"><span>consul.agent-best.net</span></div>
</body></html>
